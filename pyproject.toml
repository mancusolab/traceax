[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "traceax"
dynamic = ["version"]
description = "Stochastic trace estimation in JAX, Lineax, and Equinox"
readme = "README.md"
requires-python = ">=3.11,<4"
license = {text = "Apache2.0"}
keywords = [
  "jax",
  "trace-estimation",
  "statistics",
  "machine-learning",
]
authors = [
  { name = "Linda Serafin", email = "lserafin@usc.edu" },
  { name = "Nicholas Mancuso", email = "nmancuso@usc.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "jax>=0.4.13",
  "jaxtyping>=0.2.20",
  "equinox>=0.11.3",
  "lineax>=0.0.4",
  "typing_extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "ruff>=0.0.243",
  "ty>=0.0.44",
]
docs = [
  "mkdocstrings-python>=1.12",
  "mkdocstrings>=0.29",
  "zensical>=0.0.37",
]

[project.urls]
Documentation = "https://github.com/mancusolab/traceax#readme"
Issues = "https://github.com/mancusolab/traceax/issues"
Source = "https://github.com/mancusolab/traceax"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/traceax/_version.py"

[tool.hatch.envs.test]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
]

[tool.hatch.envs.test.scripts]
run-coverage = "pytest -p no:capture --cov-config=pyproject.toml --cov=traceax --cov=tests"
run = "pytest -p no:capture"

[[tool.hatch.envs.all.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "ty>=0.0.44",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
lint = "ruff check src tests"
format = "ruff format --check src tests"
typecheck = "ty check src tests"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not slow"]
markers = [
  "slow: broad operator/tag/dtype/size integration matrix",
]

[tool.ruff.lint]
select = ["E", "F", "I001", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["traceax"]
combine-as-imports = true
lines-after-imports = 2
lines-between-types = 1
known-local-folder = ["src"]
section-order = ["future", "standard-library", "third-party", "jax-ecosystem", "first-party", "local-folder"]
extra-standard-library = ["typing_extensions"]
order-by-type = false

[tool.ruff.lint.isort.sections]
jax-ecosystem = ["equinox", "jax", "jaxtyping", "lineax"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
source_pkgs = ["traceax", "tests"]
branch = true
parallel = true
omit = []

[tool.coverage.paths]
traceax = ["src/traceax", "*/traceax/src/traceax"]
tests = ["tests", "*/traceax/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
